name: Build (VST3 + Host app)

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dsp-tests:
    name: DSP unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I Source tests/test_dsp.cpp -o test_dsp
          ./test_dsp

  windows:
    name: VST3 + Host app (Windows x64)
    runs-on: windows-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Version
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project \(AtmosBridge VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if (-not $v) { throw "VERSION not found in CMakeLists.txt" }
          "AB_VER=$v" >> $env:GITHUB_ENV
          Write-Host "Version $v"

      # Download files (version in the name):
      #   Atmos-Bridge-Host-v<ver>-Install-win64.exe   installer (Start menu / desktop shortcuts, uninstall in Settings > Apps)
      #   Atmos-Bridge-Host-v<ver>-Portable-win64.zip  unzip anywhere and run
      #   Atmos-Bridge-7.1.4ch-v<ver>-VST3-win64.zip   the VST3 plugin
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $src = "build/AtmosBridge_artefacts/Release/VST3/Atmos Bridge 7.1.4ch.vst3"
          if (-not (Test-Path $src)) { Get-ChildItem -Recurse build/AtmosBridge_artefacts | Select-Object FullName; throw "VST3 bundle not found" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse $src "dist/Atmos Bridge 7.1.4ch.vst3"
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath "out/Atmos-Bridge-7.1.4ch-v$($env:AB_VER)-VST3-win64.zip" -Force
          Get-ChildItem -Recurse dist | Select-Object FullName, Length

          $exe = "build/AtmosBridgeHost_artefacts/Release/Atmos Bridge Host.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem -Recurse build/AtmosBridgeHost_artefacts | Select-Object FullName; throw "Host app not found" }
          New-Item -ItemType Directory -Force dist-host | Out-Null
          Copy-Item $exe "dist-host/Atmos Bridge Host.exe"
          Copy-Item README.md dist-host/README.md
          Compress-Archive -Path dist-host/* -DestinationPath "out/Atmos-Bridge-Host-v$($env:AB_VER)-Portable-win64.zip" -Force
          Get-ChildItem -Recurse dist-host | Select-Object FullName, Length

      - name: Installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) not found" }
          Write-Host "Using $($iscc.FullName)"
          & $iscc.FullName "/DAppVersion=$($env:AB_VER)" "/FAtmos-Bridge-Host-v$($env:AB_VER)-Install-win64" installer/AtmosBridgeHost.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Atmos-Bridge-v${{ env.AB_VER }}-win64
          path: out/*

      # Pushes to main publish/refresh the release for the version in CMakeLists.txt.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$AB_VER"
          echo "Release $VER"
          cat > notes.md <<EOT
          Windows x64 (build ${GITHUB_SHA::7})

          | 파일 | 무엇 |
          |---|---|
          | \`Atmos-Bridge-Host-$VER-Install-win64.exe\` | **Install 버전**: Atmos Bridge Host 설치 파일 (시작 메뉴 · 바탕화면 바로가기, 설정 > 앱에서 제거) |
          | \`Atmos-Bridge-Host-$VER-Portable-win64.zip\` | **Portable 버전**: 아무 폴더에 풀고 \`Atmos Bridge Host.exe\` 실행 |
          | \`Atmos-Bridge-7.1.4ch-$VER-VST3-win64.zip\` | **VST3 버전**: \`Atmos Bridge 7.1.4ch.vst3\` 폴더를 \`C:\\Program Files\\Common Files\\VST3\`에 복사 |

          설정 방법은 README를 참고하세요.
          EOT
          if gh release view "$VER" > /dev/null 2>&1; then
            gh release upload "$VER" out/* --clobber
            gh release edit "$VER" --notes-file notes.md
          else
            gh release create "$VER" out/* --target "$GITHUB_SHA" --title "Atmos Bridge $VER (Host app + VST3)" --notes-file notes.md
          fi
